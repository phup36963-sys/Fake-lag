name: Build GhostTeleKill NDK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86, x86_64]

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          yes | sdkmanager --licenses
          yes | sdkmanager "ndk;26.3.11579264"

      - name: Prepare project
        run: |
          mkdir -p app/src/main/jni
          mkdir -p app/src/main/libs

      - name: Create Android.mk
        run: |
          cat > app/src/main/jni/Android.mk << 'EOF'
LOCAL_PATH := $(call my-dir)

include $(CLEAR_VARS)

LOCAL_MODULE := ghost_telekill
LOCAL_SRC_FILES := ghost_telekill.c

LOCAL_LDLIBS := -llog -lm

include $(BUILD_SHARED_LIBRARY)
EOF

      - name: Create Application.mk
        run: |
          cat > app/src/main/jni/Application.mk << 'EOF'
APP_ABI := armeabi-v7a arm64-v8a x86 x86_64
APP_PLATFORM := android-21
APP_STL := c++_static
EOF

      - name: Create source
        run: |
          cat > app/src/main/jni/ghost_telekill.c << 'EOF'
#include <jni.h>
#include <android/log.h>

#define LOG_TAG "GhostTeleKill"
#define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)

JNIEXPORT void JNICALL
Java_test(JNIEnv* env, jobject obj) {
    LOGI("GhostTeleKill Loaded");
}
EOF

      - name: Build
        run: |
          NDK=$ANDROID_SDK_ROOT/ndk/26.3.11579264
          chmod +x $NDK/ndk-build
          $NDK/ndk-build \
          NDK_PROJECT_PATH=. \
          APP_BUILD_SCRIPT=app/src/main/jni/Android.mk \
          NDK_APPLICATION_MK=app/src/main/jni/Application.mk \
          NDK_LIBS_OUT=app/src/main/libs \
          APP_ABI=${{ matrix.abi }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ghost-${{ matrix.abi }}
          path: app/src/main/libs/${{ matrix.abi }}/libghost_telekill.so
