name: Build NDK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt update
          sudo apt install -y unzip wget

      - name: Download NDK
        run: |
          wget https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip android-ndk-r26d-linux.zip
          echo "NDK=$PWD/android-ndk-r26d" >> $GITHUB_ENV

      - name: Create project
        run: |
          mkdir jni
          echo 'LOCAL_PATH := $(call my-dir)' > jni/Android.mk
          echo 'include $(CLEAR_VARS)' >> jni/Android.mk
          echo 'LOCAL_MODULE := ghost_telekill' >> jni/Android.mk
          echo 'LOCAL_SRC_FILES := ghost_telekill.c' >> jni/Android.mk
          echo 'LOCAL_LDLIBS := -llog' >> jni/Android.mk
          echo 'include $(BUILD_SHARED_LIBRARY)' >> jni/Android.mk

          echo 'APP_ABI := armeabi-v7a arm64-v8a x86 x86_64' > jni/Application.mk
          echo 'APP_PLATFORM := android-21' >> jni/Application.mk

          echo '#include <jni.h>' > jni/ghost_telekill.c
          echo '#include <android/log.h>' >> jni/ghost_telekill.c
          echo '#define LOG_TAG "GhostTeleKill"' >> jni/ghost_telekill.c
          echo 'jint JNI_OnLoad(JavaVM* vm, void* r){__android_log_print(ANDROID_LOG_INFO,LOG_TAG,"Loaded");return JNI_VERSION_1_6;}' >> jni/ghost_telekill.c

      - name: Build
        run: |
          $NDK/ndk-build NDK_PROJECT_PATH=. NDK_LIBS_OUT=libs

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ghost-libs
          path: libs
