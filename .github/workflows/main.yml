name: Build GhostTeleKill NDK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86, x86_64]

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          yes | sdkmanager --licenses
          yes | sdkmanager "ndk;26.3.11579264"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> $GITHUB_ENV

      - name: Prepare folders
        run: |
          mkdir -p app/src/main/jni
          mkdir -p app/src/main/libs

      - name: Create Android.mk
        run: |
          printf "LOCAL_PATH := \$(call my-dir)\n" > app/src/main/jni/Android.mk
          printf "include \$(CLEAR_VARS)\n" >> app/src/main/jni/Android.mk
          printf "LOCAL_MODULE := ghost_telekill\n" >> app/src/main/jni/Android.mk
          printf "LOCAL_SRC_FILES := ghost_telekill.c\n" >> app/src/main/jni/Android.mk
          printf "LOCAL_LDLIBS := -llog -lm\n" >> app/src/main/jni/Android.mk
          printf "include \$(BUILD_SHARED_LIBRARY)\n" >> app/src/main/jni/Android.mk

      - name: Create Application.mk
        run: |
          printf "APP_ABI := armeabi-v7a arm64-v8a x86 x86_64\n" > app/src/main/jni/Application.mk
          printf "APP_PLATFORM := android-21\n" >> app/src/main/jni/Application.mk
          printf "APP_STL := c++_static\n" >> app/src/main/jni/Application.mk

      - name: Create source
        run: |
          printf "#include <jni.h>\n" > app/src/main/jni/ghost_telekill.c
          printf "#include <android/log.h>\n" >> app/src/main/jni/ghost_telekill.c
          printf "#define LOG_TAG \"GhostTeleKill\"\n" >> app/src/main/jni/ghost_telekill.c
          printf "#define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)\n" >> app/src/main/jni/ghost_telekill.c
          printf "JNIEXPORT void JNICALL Java_test(JNIEnv* env,jobject obj){LOGI(\"GhostTeleKill Loaded\");}\n" >> app/src/main/jni/ghost_telekill.c

      - name: Build
        run: |
          $NDK_HOME/ndk-build \
          NDK_PROJECT_PATH=. \
          APP_BUILD_SCRIPT=app/src/main/jni/Android.mk \
          NDK_APPLICATION_MK=app/src/main/jni/Application.mk \
          NDK_LIBS_OUT=app/src/main/libs \
          APP_ABI=${{ matrix.abi }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: ghost-${{ matrix.abi }}
          path: app/src/main/libs/${{ matrix.abi }}/libghost_telekill.so
