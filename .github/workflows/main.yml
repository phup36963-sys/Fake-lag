name: Build GhostTeleKill_v4 NDK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  NDK_VERSION: "26.3.11579264"
  BUILD_DIR: app/src/main/jni
  OUTPUT_DIR: app/src/main/libs
  LIB_NAME: ghost_telekill

jobs:
  build:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        abi: [armeabi-v7a, arm64-v8a, x86, x86_64]

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          yes | sdkmanager --licenses
          yes | sdkmanager "ndk;${{ env.NDK_VERSION }}"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      - name: Prepare JNI folder
        run: mkdir -p ${{ env.BUILD_DIR }}

      - name: Create Android.mk
        run: |
          cat > ${{ env.BUILD_DIR }}/Android.mk << 'EOF'
LOCAL_PATH := $(call my-dir)

include $(CLEAR_VARS)

LOCAL_MODULE := ghost_telekill
LOCAL_SRC_FILES := ghost_telekill.c

LOCAL_LDLIBS := -llog -lm

include $(BUILD_SHARED_LIBRARY)
EOF

      - name: Create Application.mk
        run: |
          cat > ${{ env.BUILD_DIR }}/Application.mk << 'EOF'
APP_ABI := armeabi-v7a arm64-v8a x86 x86_64
APP_PLATFORM := android-21
APP_STL := c++_static
EOF

      - name: Create demo source
        run: |
          cat > ${{ env.BUILD_DIR }}/ghost_telekill.c << 'EOF'
#include <jni.h>
#include <android/log.h>

#define LOG_TAG "GhostTeleKill"
#define LOGI(...) __android_log_print(ANDROID_LOG_INFO, LOG_TAG, __VA_ARGS__)

JNIEXPORT void JNICALL
Java_com_example_test(JNIEnv *env, jobject thiz) {
    LOGI("GhostTeleKill Loaded");
}
EOF

      - name: Build NDK
        run: |
          $NDK_HOME/ndk-build \
          NDK_PROJECT_PATH=. \
          APP_BUILD_SCRIPT=${{ env.BUILD_DIR }}/Android.mk \
          NDK_APPLICATION_MK=${{ env.BUILD_DIR }}/Application.mk \
          NDK_LIBS_OUT=${{ env.OUTPUT_DIR }} \
          APP_ABI=${{ matrix.abi }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libghost-${{ matrix.abi }}
          path: ${{ env.OUTPUT_DIR }}/${{ matrix.abi }}/libghost_telekill.so
